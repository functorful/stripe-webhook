version = file('version.txt').getText("utf8").trim()
group = "com.functorful.stripewebhook"

def executeCommand(command) {
    def result = command.execute([], projectDir)
    result.waitFor()
    return result.text.trim()
}

def findGitSha() {
    return executeCommand('git rev-parse --short HEAD')
}

def findGitBranch() {
    return executeCommand('git rev-parse --abbrev-ref HEAD')
}

def findGitTag() {
    return executeCommand('git describe --exact-match --tags')
}

def gitSha = findGitSha()
def gitBranch = findGitBranch()
def gitTag = findGitTag()
// In CI the runner checks out a commit; CI_COMMIT_REF_NAME (GitLab) or GITHUB_REF_NAME (GitHub) provides the ref.
def ciRefName = System.getenv('GITHUB_REF_NAME') ?: System.getenv('CI_COMMIT_REF_NAME')

def tagMatcher = ciRefName =~ /^v(\d+\.\d+\.\d+)$/
def isTag = tagMatcher.matches()

def dockerImageTag = isTag ? "v$project.version" : "rc$project.version-$gitSha"
def dockerImage = "449463292843.dkr.ecr.eu-west-1.amazonaws.com/stripe-webhook:$dockerImageTag"

println("Version       ==> $project.version")
println("Git branch    ==> $gitBranch")
println("Git tag       ==> $gitTag")
println("Git SHA       ==> $gitSha")
println("CI ref        ==> $ciRefName")
println("Docker image  ==> $dockerImage")


