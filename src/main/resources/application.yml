micronaut.application.name: stripe-webhook

# These are populated by the Lambda environment at runtime; Micronaut maps
# the upper-case `STRIPE_WEBHOOK_SIGNING_SECRET_ARN` env var to
# `stripe.webhook.signing-secret-arn` automatically, but declaring them here
# makes the binding explicit and gives a clear failure message if the
# Lambda environment is misconfigured.
stripe:
  webhook:
    signing-secret-arn: ${STRIPE_WEBHOOK_SIGNING_SECRET_ARN}

webhook-events:
  table-name: ${WEBHOOK_EVENTS_TABLE_NAME}

# Build provenance — bound to the Datadog-convention env vars the
# Dockerfile already sets (see build.gradle's `dockerEnv()` block).
# Decoupled from the `dd.*` namespace so the application code reads
# through the typed `BuildMetadataProperties` bean rather than the
# Datadog APM tag namespace. See `BuildMetadataProperties` Javadoc.
build:
  version: ${DD_VERSION:unknown}
  git-sha: ${GIT_SHA:unknown}
